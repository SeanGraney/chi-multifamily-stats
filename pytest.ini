# Repo-wide pytest wiring (F0-S1a). Bare `pytest` from the repo root — with
# the repo-root .venv active — collects BOTH suites:
#   scripts/tests/   T-S3 gate harness tests
#   backend/tests/   backend unit + API-contract tests (ARCHITECTURE.md §8)
# scripts/tests_dev/ is intentionally excluded (dev-only live-gate harness).
[pytest]
testpaths =
    scripts/tests
    backend/tests
